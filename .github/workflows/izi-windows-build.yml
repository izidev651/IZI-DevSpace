# IZI DevSpace (Zen/Firefox base) — Windows x64 build.
# Cross-compiles on a free GitHub-hosted Ubuntu runner (adapted from Zen's
# windows-release-build.yml, which uses paid 16-core runners). PGO and LTO are off
# to fit the 6-hour job limit; sccache keeps later builds much faster.
name: Zen Windows build

on:
  push:
    branches: [zen]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: zen-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    name: Build Windows x64
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      SCCACHE_GHA_ENABLED: 'true'
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      SURFER_COMPAT: x86_64
      ZEN_DISABLE_LTO: 1
      ZEN_GA_DISABLE_PGO: 1
      IZI_FAST_BUILD: 1
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: sccache
        uses: mozilla-actions/sccache-action@main
        with:
          disable_annotations: true

      - name: Expose actions cache variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env['ACTIONS_CACHE_URL'])
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN'])

      - name: Setup Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: |
          npm ci
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get install -y python3 python3-pip dos2unix yasm nasm build-essential libgtk2.0-dev libpython3-dev m4 uuid libasound2-dev libcurl4-openssl-dev libdbus-1-dev libdrm-dev libdbus-glib-1-dev libgtk-3-dev libpulse-dev libx11-xcb-dev libxt-dev xvfb lld llvm rsync --fix-missing

      - name: Load Surfer CI setup
        run: npm run surfer -- ci --brand release --display-version "$(jq -r '.brands.release.release.displayVersion' surfer.json)"

      - name: Download Firefox source
        run: npm run download

      - name: win-cross cache
        id: cache-win-cross
        uses: actions/cache@v4
        with:
          path: ~/win-cross
          key: win-cross-vs2026-v1

      - name: Install cross-build system packages
        run: |
          sudo apt-get -o Acquire::Retries=3 install -y python3-launchpadlib
          sudo add-apt-repository -y ppa:savoury1/backports
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y python3-pip autoconf autoconf2.13 automake bison build-essential \
            cabextract curl cmake flex gawk gcc-multilib git gnupg jq libbz2-dev libexpat1-dev libffi-dev libncursesw5-dev \
            libsqlite3-dev libssl-dev libtool libucl-dev libxml2-dev msitools ninja-build openssh-client p7zip-full pkg-config \
            procps python3-requests python3-toml scons subversion tar unzip uuid uuid-dev wget zip zlib1g-dev aria2

      - name: Download wine + Visual Studio SDK (cache miss only)
        if: steps.cache-win-cross.outputs.cache-hit != 'true'
        run: |
          set -x
          mkdir -p ~/win-cross
          cd engine/
          aria2c "https://firefox-ci-tc.services.mozilla.com/api/index/v1/task/gecko.cache.level-3.toolchains.v3.linux64-wine.latest/artifacts/public/build/wine.tar.zst" -o wine.tar.zst
          tar --zstd -xf wine.tar.zst -C ~/win-cross
          rm wine.tar.zst
          ./mach python --virtualenv build taskcluster/scripts/misc/get_vs.py build/vs/vs2026.yaml ~/win-cross/vs2026

      - name: Import patches
        run: |
          . "$HOME/.cargo/env" 2>/dev/null || true
          npm run import -- --verbose

      - name: Bootstrap
        run: |
          set -x
          chmod -R +x ~/win-cross/vs2026 || true
          export SURFER_PLATFORM="win32"
          npm run bootstrap
          echo "export LIB=\"$(cd ~/.mozbuild/clang/lib/clang/* && cd lib/windows && pwd)\"" >> configs/common/mozconfig

      - name: Setup Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain $(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          source $HOME/.cargo/env
          rustup target add x86_64-pc-windows-msvc
          WINDOWS_RS_VERSION=$(cat build/windows/.windows-rs-version)
          curl -fsSL "https://static.crates.io/crates/cargo-download/cargo-download-0.1.2.crate" | tar xz -C /tmp
          (cd /tmp/cargo-download-0.1.2 && cargo generate-lockfile && cargo update tinyvec --precise 1.12.0)
          RUSTFLAGS="--cap-lints=allow" cargo install --path /tmp/cargo-download-0.1.2 --locked
          cd engine/
          cargo download -x windows=$WINDOWS_RS_VERSION
          echo "" >> ../configs/common/mozconfig
          echo "export MOZ_WINDOWS_RS_DIR=$(pwd)/windows-$WINDOWS_RS_VERSION" >> ../configs/common/mozconfig

      - name: Language packs
        run: sh scripts/download-language-packs.sh

      - name: Build
        env:
          ZEN_RELEASE_BRANCH: release
        run: |
          set -x
          dos2unix configs/windows/mozconfig
          export SURFER_PLATFORM="win32"
          export ZEN_CROSS_COMPILING=1
          df -h .
          bash .github/workflows/src/release-build.sh

      - name: Package
        run: |
          set -x
          export SURFER_PLATFORM="win32"
          export ZEN_CROSS_COMPILING=1
          export ZEN_RELEASE=1
          npm run package
          ls -la ./dist
          mkdir -p out
          # dist/ holds several *.installer*.exe and *.zip files; pick the exact ones.
          cp ./dist/zen.installer.exe out/IZI-DevSpace-Setup-x64.exe
          cp "$(ls ./dist/*.en-US.win64.zip | grep -v xpt_artifacts | head -n1)" out/IZI-DevSpace-x64-portable.zip
          ls -la out

      - name: Upload Windows build
        uses: actions/upload-artifact@v5
        with:
          name: IZI-DevSpace-Windows-x64
          path: out/*
          retention-days: 30

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

  windows-preview:
    name: UI preview on Windows
    needs: windows-x64
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: IZI-DevSpace-Windows-x64
          path: dl

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run UI checks + screenshots
        shell: pwsh
        run: |
          python -m pip install marionette_driver
          Expand-Archive dl/IZI-DevSpace-x64-portable.zip -DestinationPath app
          $exe = Get-ChildItem app -Recurse -Filter zen.exe | Select-Object -First 1
          $prof = Join-Path $env:RUNNER_TEMP "izi-profile"
          New-Item -ItemType Directory -Force -Path $prof | Out-Null
          @(
            'user_pref("zen.welcome-screen.seen", true);',
            'user_pref("browser.shell.checkDefaultBrowser", false);',
            'user_pref("browser.startup.homepage_override.mstone", "ignore");',
            'user_pref("datareporting.policy.dataSubmissionEnabled", false);',
            'user_pref("toolkit.telemetry.reportingpolicy.firstRun", false);'
          ) | Set-Content -Path (Join-Path $prof "user.js")
          Start-Process -FilePath $exe.FullName -ArgumentList "--marionette","--no-remote","--profile",$prof,"about:blank"
          New-Item -ItemType Directory -Force -Path preview-out | Out-Null
          python scripts/izi_preview.py preview-out
          if ($LASTEXITCODE -ne 0) { Write-Host "preview script exit code $LASTEXITCODE" }
          Get-Process zen -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-ChildItem preview-out

      - name: Publish to zen-preview branch
        if: always()
        shell: bash
        run: |
          set -x
          [ -d preview-out ] || exit 0
          cd preview-out
          printf '# IZI DevSpace — UI preview (Windows)\n\nCommit: %s\nRun: %s/%s/actions/runs/%s\n' "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > README.md
          git init -q -b zen-preview
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "UI preview (Windows) for $GITHUB_SHA"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" zen-preview
